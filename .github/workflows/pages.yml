name: Deploy naar GitHub Pages

# Publishes the game to the gh-pages branch, which GitHub Pages serves.
on:
  push:
    branches: [main, claude/last-airbender-game-t66w11]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Site samenstellen en publiceren
        run: |
          mkdir _site
          cp -r index.html src _site/
          touch _site/.nojekyll
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
